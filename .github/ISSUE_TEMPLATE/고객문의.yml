name: "\U0001F4E8 고객문의"
description: "고객에게 확인/질의해야 할 사항을 등록하고 답변을 추적합니다."
labels: ["type:고객문의"]
body:
  - type: markdown
    attributes:
      value: |
        ## 고객문의 등록
        프로젝트 진행 중 고객에게 확인이 필요한 사항을 등록합니다.
        답변을 받으면 이슈 코멘트에 기록하고 종료하세요.

  - type: textarea
    id: question
    attributes:
      label: "문의 내용"
      description: "고객에게 확인할 질문을 구체적으로 작성하세요."
      placeholder: "예: 주문 취소 시 환불 처리 기준이 결제 수단별로 다른지 확인 필요"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "배경"
      description: "왜 이 확인이 필요한지, 관련 요구사항이나 세부기능을 기재하세요."
      placeholder: |
        세부기능-주문취소.md 작성 중, 환불 정책에 대한 명확한 기준이 없어
        구현 방향을 결정할 수 없습니다.
        관련: #42 (세부기능: 주문 취소 처리)
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: "긴급도"
      description: "답변이 필요한 시급도를 선택하세요."
      options:
        - "일반 — 다음 회의 시 확인"
        - "높음 — 이번 주 내 답변 필요"
        - "긴급 — 답변 전까지 작업 중단"
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: "답변 기한"
      description: "답변이 필요한 날짜를 입력하세요."
      placeholder: "YYYY-MM-DD"

  - type: textarea
    id: context
    attributes:
      label: "추가 정보"
      description: "스크린샷, 관련 이슈 번호, 참고자료 등을 첨부하세요."
