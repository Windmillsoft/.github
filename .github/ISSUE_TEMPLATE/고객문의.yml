name: "\U0001F4E8 고객문의"
description: "고객이 문의한 사항을 등록하고 답변/처리를 추적합니다."
labels: ["type:고객문의"]
body:
  - type: markdown
    attributes:
      value: |
        ## 고객문의 등록
        고객이 우리에게 문의한 사항을 등록합니다.
        처리 완료 후 결과를 코멘트에 기록하고 이슈를 종료하세요.

  - type: textarea
    id: inquiry
    attributes:
      label: "문의 내용"
      description: "고객이 문의한 내용을 작성하세요."
      placeholder: "예: 주문 내역 조회 화면에서 3개월 이전 데이터가 표시되지 않는다고 합니다."
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "배경 및 관련 항목"
      description: "문의 경위, 관련 기능/요구사항 등을 기재하세요."
      placeholder: |
        2월 15일 정기 회의에서 고객 PM이 언급.
        관련: #42 (세부기능: 주문 내역 조회)
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: "긴급도"
      description: "답변/처리가 필요한 시급도를 선택하세요."
      options:
        - "일반 — 다음 회의 시 답변"
        - "높음 — 이번 주 내 답변 필요"
        - "긴급 — 즉시 답변 필요"
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: "답변 기한"
      description: "답변이 필요한 날짜를 입력하세요."
      placeholder: "YYYY-MM-DD"

  - type: textarea
    id: context
    attributes:
      label: "추가 정보"
      description: "스크린샷, 관련 이슈 번호, 참고자료 등을 첨부하세요."
